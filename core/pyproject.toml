[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lozi-core"
version = "0.1.0"
description = "Lozi-Core: MCP-Server mit Lozis Werkzeugen und Display-Hub für alle Bildschirme"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
lozi-core = "lozi_core.__main__:main"

[tool.setuptools.packages.find]
include = ["lozi_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
